<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRQA 관리자 설정</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- 컨트롤 버튼들 -->
    <div class="control-buttons">
        <!-- 언어 선택기 -->
        <div class="language-selector">
            <select id="languageSelect" class="language-dropdown">
                <option value="ko">🇰🇷 한국어</option>
                <option value="en">🇺🇸 English</option>
            </select>
        </div>
        
        <!-- 테마 토글 버튼 -->
        <button class="theme-toggle" id="themeToggle">
            <span class="theme-toggle-icon">🌙</span>
            <span class="theme-toggle-text" data-i18n="theme.dark">다크모드</span>
        </button>
    </div>
    
    <style>
        /* CSS 변수 정의 */
        :root {
            /* 라이트 모드 */
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --accent-primary: #7c3aed;
            --accent-secondary: #a855f7;
        }

        [data-theme="dark"] {
            /* 다크 모드 */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --accent-primary: #8b5cf6;
            --accent-secondary: #a78bfa;
        }

        /* 기본 body 스타일 */
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 컨트롤 버튼들 컨테이너 */
        .control-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        /* 언어 선택기 */
        .language-selector {
            position: relative;
        }
        
        .language-dropdown {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            min-width: 120px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px var(--shadow-color);
        }
        
        .language-dropdown:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        
        .language-dropdown:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-primary);
        }
        
        /* 테마 토글 버튼 스타일 */
        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-primary);
        }

        .theme-toggle-icon {
            font-size: 16px;
        }

        /* 테마 전환 애니메이션 */
        .theme-transitioning * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease !important;
        }

        /* 관리자 전용 스타일 */
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .admin-header {
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .admin-tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
        }
        
        .admin-tab {
            padding: 15px 30px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .admin-tab.active {
            color: #7c3aed;
            border-bottom-color: #7c3aed;
        }
        
        .admin-tab:hover {
            color: #7c3aed;
            background-color: var(--bg-tertiary);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .applications-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: var(--bg-secondary);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px var(--shadow-color);
        }
        
        .applications-table th,
        .applications-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .applications-table th {
            background-color: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        .applications-table tr:hover {
            background-color: var(--bg-tertiary);
        }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .status-new {
            background-color: #dbeafe;
            color: #1e40af;
        }
        
        .status-progress {
            background-color: #fef3c7;
            color: #92400e;
        }
        
        .status-completed {
            background-color: #d1fae5;
            color: #065f46;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .action-btn.view {
            background-color: #3b82f6;
            color: white;
        }
        
        .action-btn.edit {
            background-color: #f59e0b;
            color: white;
        }
        
        .action-btn.delete {
            background-color: #ef4444;
            color: white;
        }
        
        
        .action-btn.quote {
            background-color: #10b981;
            color: white;
        }
        
        .action-btn.quote:hover {
            background-color: #059669;
        }

        .action-btn:hover {
            opacity: 0.8;
        }
        
        .settings-form {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--shadow-color);
        }
        
        .settings-section {
            margin-bottom: 30px;
        }
        
        .settings-section h4 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: var(--bg-secondary);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--shadow-color);
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 1rem;
            color: var(--text-muted);
        }
        
        .export-section {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--shadow-color);
            margin-bottom: 30px;
        }
        
        .export-btn {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
        }

        /* 검색 컨트롤 스타일 */
        .list-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 500px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            padding: 10px 20px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #6d28d9;
            transform: translateY(-1px);
        }

        .clear-search-btn {
            padding: 10px 15px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .clear-search-btn:hover {
            background: var(--bg-secondary);
            border-color: #7c3aed;
        }

        /* 검색 결과 하이라이트 */
        .highlight {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 500;
        }

        /* 검색 결과 없음 스타일 */
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .no-results .icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .no-results .message {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .no-results .suggestion {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* 페이지네이션 스타일 */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding: 15px 0;
            border-top: 1px solid var(--border-color);
        }

        .pagination-info {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pagination-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--bg-tertiary);
            border-color: #7c3aed;
        }

        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-numbers {
            display: flex;
            gap: 5px;
        }

        .page-number {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            min-width: 40px;
            text-align: center;
        }

        .page-number:hover {
            background: var(--bg-tertiary);
            border-color: #7c3aed;
        }

        .page-number.active {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
        }

        .page-number.dots {
            cursor: default;
            border: none;
            background: transparent;
        }

        .page-number.dots:hover {
            background: transparent;
        }

        .login-section {
            background: var(--bg-secondary);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--shadow-color);
            margin-bottom: 30px;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .login-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .admin-content {
            display: none;
        }

        .admin-content.authenticated {
            display: block;
        }

        /* 수정 모달 스타일 */
        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--bg-primary);
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h3 {
            margin: 0;
            color: var(--text-primary);
        }

        .close {
            color: var(--text-muted);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close:hover {
            color: #ef4444;
        }

        .modal-body {
            padding: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 20px 30px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-cancel:hover {
            background-color: var(--bg-secondary);
        }

        .btn-save {
            background-color: #7c3aed;
            color: white;
        }

        .btn-save:hover {
            background-color: #6d28d9;
        }

        /* 신청서 보기 모달 스타일 */
        .view-content {
            max-height: 70vh;
            overflow-y: auto;
        }

        .view-section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid #7c3aed;
        }

        .view-section h4 {
            color: #7c3aed;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 8px;
        }

        .view-field {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 15px;
            margin-bottom: 12px;
            align-items: start;
        }

        .view-label {
            font-weight: 600;
            color: #374151;
            padding: 8px 0;
        }

        .view-value {
            padding: 8px 12px;
            background-color: white;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            min-height: 20px;
        }

        .view-value.empty {
            color: #9ca3af;
            font-style: italic;
        }

        .view-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .view-status.status-new {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .view-status.status-progress {
            background-color: #fef3c7;
            color: #92400e;
        }

        .view-status.status-completed {
            background-color: #d1fae5;
            color: #065f46;
        }

        /* 신청서 보기용 스타일 (index.html 기반) */
        .application-view {
            font-family: 'Malgun Gothic', Arial, sans-serif;
            font-size: 11px;
            line-height: 1.4;
            background-color: white;
            color: #333;
            padding: 20px;
        }
        
        .application-view .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
        }
        
        .application-view .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 40px 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .application-view .header::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 200px 150px;
            border-color: transparent transparent #00d4aa transparent;
        }
        
        .application-view .lrqa-logo {
            position: absolute;
            top: 20px;
            left: 30px;
            width: 60px;
            height: 60px;
            background-image: url('./lrqa-logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        
        .application-view .header h1 {
            font-size: 32px;
            font-weight: bold;
            margin: 60px 0 10px 0;
            color: white;
        }
        
        .application-view .header h2 {
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            color: #00d4aa;
        }
        
        .application-view .intro-text {
            font-size: 11px;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #555;
        }
        
        .application-view .section {
            margin-bottom: 30px;
        }
        
        .application-view .section-title {
            background-color: #00d4aa;
            color: white;
            padding: 12px 15px;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 20px;
            border-radius: 0;
        }
        
        .application-view .form-row {
            display: flex;
            margin-bottom: 12px;
            align-items: center;
        }
        
        .application-view .form-row.full-width {
            flex-direction: column;
            align-items: stretch;
        }
        
        .application-view .form-label {
            font-size: 11px;
            margin-right: 15px;
            min-width: 140px;
            color: #333;
            font-weight: 500;
        }
        
        .application-view .form-input {
            border: none;
            border-bottom: 1px solid #333;
            padding: 4px 8px;
            font-size: 11px;
            flex: 1;
            margin-right: 20px;
            background: transparent;
            font-family: 'Malgun Gothic', Arial, sans-serif;
        }
        
        .application-view .form-input.short {
            flex: 0 0 100px;
        }
        
        .application-view .form-input.medium {
            flex: 0 0 150px;
        }
        
        .application-view .table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        
        .application-view .table th,
        .application-view .table td {
            border: 1px solid #333;
            padding: 8px;
            font-size: 11px;
            text-align: left;
        }
        
        .application-view .table th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #333;
        }
        
        .application-view .textarea {
            border: 1px solid #333;
            padding: 8px;
            font-size: 11px;
            width: 100%;
            min-height: 60px;
            resize: vertical;
            font-family: 'Malgun Gothic', Arial, sans-serif;
            border-radius: 0;
        }
        
        .application-view .footer {
            margin-top: 40px;
            font-size: 10px;
            text-align: right;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;

        // 현재 언어 설정
        let currentLanguage = 'ko';

        // 상태값 번역 함수
        function translateStatus(status) {
            if (currentLanguage === 'en') {
                const statusMap = {
                    '신규': 'New',
                    '진행중': 'In Progress',
                    '완료': 'Completed'
                };
                return statusMap[status] || status;
            }
            return status;
        }

        // 날짜 형식 변환 함수
        function formatDateForLanguage(dateString) {
            if (!dateString) return '-';
            
            try {
                const date = new Date(dateString);
                if (currentLanguage === 'en') {
                    return date.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                } else {
                    return date.toLocaleDateString('ko-KR', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }
            } catch (error) {
                return dateString;
            }
        }

        // 언어 전환 함수
        function changeLanguage(language) {
            currentLanguage = language;
            document.documentElement.lang = language;
            
            // 모든 data-i18n 속성이 있는 요소들을 업데이트
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[language] && translations[language][key]) {
                    element.textContent = translations[language][key];
                }
            });
            
            // placeholder 속성 업데이트
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.getAttribute('data-i18n-placeholder');
                if (translations[language] && translations[language][key]) {
                    element.placeholder = translations[language][key];
                }
            });
            
            // 테마 토글 텍스트 업데이트
            const themeText = document.querySelector('.theme-toggle-text');
            if (themeText) {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    themeText.textContent = language === 'ko' ? '라이트모드' : 'Light Mode';
                } else {
                    themeText.textContent = language === 'ko' ? '다크모드' : 'Dark Mode';
                }
            }
            
            // 동적으로 생성된 테이블 데이터 다시 렌더링
            if (typeof displayCurrentPage === 'function') {
                displayCurrentPage();
            }
        }

        // 인증 상태 확인
        let isAuthenticated = false;
        
        // 로그인 처리
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // 간단한 인증 (실제 환경에서는 더 안전한 방법 사용)
            if (username === 'admin' && password === 'lrqa2025') {
                isAuthenticated = true;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminContent').classList.add('authenticated');
                loadDashboard();
            } else {
                alert('로그인 정보가 올바르지 않습니다.');
            }
        });

        // 로그아웃
        function logout() {
            isAuthenticated = false;
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminContent').classList.remove('authenticated');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // 탭 전환
        function showTab(tabName) {
            // 모든 탭 비활성화
            const tabs = document.querySelectorAll('.admin-tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            
            // 선택된 탭 활성화
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        // 대시보드 로드
        async function loadDashboard() {
            if (!isAuthenticated) return;
            
            try {
                const response = await fetch('/.netlify/functions/get-applications');
                const result = await response.json();
                
                if (result.success) {
                    const stats = result.data.stats;
                    document.getElementById('totalApplications').textContent = stats.total;
                    document.getElementById('newApplications').textContent = stats.new;
                    document.getElementById('monthlyApplications').textContent = stats.monthly;
                    document.getElementById('completedApplications').textContent = stats.completed;
                    
                    // Google Sheets URL 업데이트
                    window.currentSheetUrl = result.data.sheetUrl;
                    
                    showMessage('대시보드가 로드되었습니다.', 'success');
                } else {
                    showMessage(result.message || '대시보드 로드 중 오류가 발생했습니다.', 'error');
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
                showMessage('대시보드 로드 중 오류가 발생했습니다.', 'error');
            }
        }

        // 페이지네이션 변수
        let allApplications = [];
        let filteredApplications = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let currentSearchTerm = '';

        // 신청서 목록 로드
        async function loadApplications() {
            if (!isAuthenticated) return;
            
            try {
                const tbody = document.getElementById('applicationsTableBody');
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">데이터를 불러오는 중...</td></tr>';
                
                const response = await fetch('/.netlify/functions/get-applications');
                const result = await response.json();
                
                if (result.success) {
                    allApplications = result.data.applications;
                    filteredApplications = [...allApplications]; // 초기에는 모든 신청서
                    currentPage = 1; // 첫 페이지로 리셋
                    currentSearchTerm = ''; // 검색어 초기화
                    
                    // 검색 입력창 초기화
                    document.getElementById('searchInput').value = '';
                    
                    if (filteredApplications.length === 0) {
                        if (currentSearchTerm) {
                            tbody.innerHTML = `
                                <tr>
                                    <td colspan="7">
                                        <div class="no-results">
                                            <div class="icon">🔍</div>
                                            <div class="message">검색 결과가 없습니다</div>
                                            <div class="suggestion">"${currentSearchTerm}"에 대한 검색 결과를 찾을 수 없습니다.<br>다른 검색어를 시도해보세요.</div>
                                        </div>
                                    </td>
                                </tr>
                            `;
                        } else {
                            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">신청서가 없습니다.</td></tr>';
                        }
                        updatePaginationInfo();
                    } else {
                        displayCurrentPage();
                    }
                    
                    showMessage('신청서 목록이 로드되었습니다.', 'success');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">데이터 로드 중 오류가 발생했습니다.</td></tr>';
                    showMessage(result.message || '신청서 목록 로드 중 오류가 발생했습니다.', 'error');
                }
            } catch (error) {
                console.error('Error loading applications:', error);
                const tbody = document.getElementById('applicationsTableBody');
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">데이터 로드 중 오류가 발생했습니다.</td></tr>';
                showMessage('신청서 목록 로드 중 오류가 발생했습니다.', 'error');
            }
        }

        // 현재 페이지 표시
        function displayCurrentPage() {
            const tbody = document.getElementById('applicationsTableBody');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentApplications = filteredApplications.slice(startIndex, endIndex);
            
            tbody.innerHTML = currentApplications.map(app => `
                <tr>
                    <td>${formatDateForLanguage(app['신청일시'])}</td>
                    <td>${currentSearchTerm ? highlightSearchTerm(app['법인명(국문)'] || app['법인명(영문)'] || '-', currentSearchTerm) : (app['법인명(국문)'] || app['법인명(영문)'] || '-')}</td>
                    <td>${currentSearchTerm ? highlightSearchTerm(app['담당자명'] || '-', currentSearchTerm) : (app['담당자명'] || '-')}</td>
                    <td>${currentSearchTerm ? highlightSearchTerm(app['담당자전화'] || '-', currentSearchTerm) : (app['담당자전화'] || '-')}</td>
                    <td>${app['인증범위'] || '-'}</td>
                    <td>
                        <span class="status-badge ${getStatusClass(app['상태'])}">${translateStatus(app['상태'] || '신규')}</span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn view" onclick="viewApplication('${app['신청일시']}')" data-i18n="applications.view">보기</button>
                            <button class="action-btn edit" onclick="editApplication('${app['신청일시']}')" data-i18n="applications.edit">수정</button>

                            <button class="action-btn quote" onclick="generateQuotation('${app['신청일시']}')" data-i18n="applications.quote">견적서</button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            updatePaginationInfo();
            updatePaginationControls();
        }

        // 페이지네이션 정보 업데이트
        function updatePaginationInfo() {
            const totalItems = filteredApplications.length;
            const startItem = totalItems === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
            const endItem = Math.min(currentPage * itemsPerPage, totalItems);
            
            let infoText = `총 ${totalItems}개 신청서 (${startItem}-${endItem}번째)`;
            if (currentSearchTerm) {
                infoText += ` - "${currentSearchTerm}" 검색 결과`;
            }
            
            document.getElementById('paginationInfo').textContent = infoText;
        }

        // 페이지네이션 컨트롤 업데이트
        function updatePaginationControls() {
            const totalPages = Math.ceil(filteredApplications.length / itemsPerPage);
            const pageNumbersContainer = document.getElementById('pageNumbers');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            
            // 이전/다음 버튼 상태 업데이트
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
            
            // 페이지 번호 생성
            let pageNumbersHTML = '';
            
            if (totalPages <= 7) {
                // 7페이지 이하면 모든 번호 표시
                for (let i = 1; i <= totalPages; i++) {
                    pageNumbersHTML += `<button class="page-number ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                }
            } else {
                // 7페이지 초과면 스마트 페이지네이션
                if (currentPage <= 4) {
                    // 앞쪽 페이지들
                    for (let i = 1; i <= 5; i++) {
                        pageNumbersHTML += `<button class="page-number ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                    }
                    pageNumbersHTML += `<span class="page-number dots">...</span>`;
                    pageNumbersHTML += `<button class="page-number" onclick="goToPage(${totalPages})">${totalPages}</button>`;
                } else if (currentPage >= totalPages - 3) {
                    // 뒤쪽 페이지들
                    pageNumbersHTML += `<button class="page-number" onclick="goToPage(1)">1</button>`;
                    pageNumbersHTML += `<span class="page-number dots">...</span>`;
                    for (let i = totalPages - 4; i <= totalPages; i++) {
                        pageNumbersHTML += `<button class="page-number ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                    }
                } else {
                    // 중간 페이지들
                    pageNumbersHTML += `<button class="page-number" onclick="goToPage(1)">1</button>`;
                    pageNumbersHTML += `<span class="page-number dots">...</span>`;
                    for (let i = currentPage - 1; i <= currentPage + 1; i++) {
                        pageNumbersHTML += `<button class="page-number ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                    }
                    pageNumbersHTML += `<span class="page-number dots">...</span>`;
                    pageNumbersHTML += `<button class="page-number" onclick="goToPage(${totalPages})">${totalPages}</button>`;
                }
            }
            
            pageNumbersContainer.innerHTML = pageNumbersHTML;
        }

        // 특정 페이지로 이동
        function goToPage(page) {
            if (page >= 1 && page <= Math.ceil(filteredApplications.length / itemsPerPage)) {
                currentPage = page;
                displayCurrentPage();
            }
        }

        // 이전 페이지로 이동
        function goToPreviousPage() {
            if (currentPage > 1) {
                goToPage(currentPage - 1);
            }
        }

        // 다음 페이지로 이동
        function goToNextPage() {
            const totalPages = Math.ceil(filteredApplications.length / itemsPerPage);
            if (currentPage < totalPages) {
                goToPage(currentPage + 1);
            }
        }

        // 검색 수행
        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
            currentSearchTerm = searchTerm;
            
            if (searchTerm === '') {
                // 검색어가 없으면 모든 신청서 표시
                filteredApplications = [...allApplications];
                showMessage('검색이 초기화되었습니다.', 'info');
            } else {
                // 검색어로 필터링
                filteredApplications = allApplications.filter(app => {
                    const companyName = (app['법인명(국문)'] || app['법인명(영문)'] || '').toLowerCase();
                    const contactName = (app['담당자명'] || '').toLowerCase();
                    const contactPhone = (app['담당자전화'] || '').toLowerCase();
                    const contactEmail = (app['담당자이메일'] || '').toLowerCase();
                    const address = (app['주소'] || '').toLowerCase();
                    
                    return companyName.includes(searchTerm) ||
                           contactName.includes(searchTerm) ||
                           contactPhone.includes(searchTerm) ||
                           contactEmail.includes(searchTerm) ||
                           address.includes(searchTerm);
                });
                
                const resultCount = filteredApplications.length;
                if (resultCount > 0) {
                    showMessage(`"${searchTerm}" 검색 결과: ${resultCount}개 신청서를 찾았습니다.`, 'success');
                } else {
                    showMessage(`"${searchTerm}" 검색 결과가 없습니다.`, 'warning');
                }
            }
            
            // 첫 페이지로 이동하고 결과 표시
            currentPage = 1;
            displayCurrentPage();
        }

        // 검색 초기화
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            currentSearchTerm = '';
            filteredApplications = [...allApplications];
            currentPage = 1;
            displayCurrentPage();
            showMessage('검색이 초기화되었습니다.', 'info');
        }

        // 검색어 하이라이트 함수
        function highlightSearchTerm(text, searchTerm) {
            if (!searchTerm || !text) return text;
            
            const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Enter 키로 검색 실행
        document.addEventListener('DOMContentLoaded', function() {
            // 언어 선택 드롭다운 이벤트 리스너 추가
            const languageSelect = document.getElementById('languageSelect');
            if (languageSelect) {
                languageSelect.addEventListener('change', function() {
                    const selectedLanguage = this.value;
                    changeLanguage(selectedLanguage);
                });
            }
            
            // 검색 입력 필드 이벤트 리스너
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
            
            // 초기 언어 설정
            changeLanguage(currentLanguage);
        });

        // CSV 내보내기
        async function exportToCSV() {
            if (!isAuthenticated) return;
            
            try {
                showMessage('CSV 파일을 준비 중입니다...', 'info');
                
                const response = await fetch('/.netlify/functions/export-csv');
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `LRQA_ISO_Applications_${new Date().toISOString().split('T')[0]}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    
                    showMessage('CSV 파일이 다운로드되었습니다.', 'success');
                } else {
                    showMessage('CSV 내보내기 중 오류가 발생했습니다.', 'error');
                }
            } catch (error) {
                console.error('Error exporting CSV:', error);
                showMessage('CSV 내보내기 중 오류가 발생했습니다.', 'error');
            }
        }

        // Google Sheets 열기
        function openGoogleSheet() {
            if (!isAuthenticated) return;
            
            const sheetUrl = window.currentSheetUrl || 'https://docs.google.com/spreadsheets/d/1qX7aAZuC5AimWEg-SeLvyoxyHWGn_E9Pb2f-OBd4VS0/edit';
            window.open(sheetUrl, '_blank');

        // 헬퍼 함수들
        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('ko-KR', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (error) {
                return dateString;
            }
        }

        function getStatusClass(status) {
            switch(status) {
                case '신규': return 'status-new';
                case '진행중': return 'status-progress';
                case '완료': return 'status-completed';
                default: return 'status-new';
            }
        }

                if (result.success) {
                    const application = result.data.applications.find(app => app['신청일시'] === timestamp);
                    if (application) {
                        populateEditForm(application);
                        document.getElementById('editModal').style.display = 'block';
                    } else {
                        showMessage('신청서를 찾을 수 없습니다.', 'error');
                    }
                } else {
                    showMessage('신청서 데이터를 불러올 수 없습니다.', 'error');
                }
            } catch (error) {
                console.error('Error loading application:', error);
                showMessage('신청서 로드 중 오류가 발생했습니다.', 'error');
            }

                '희망월': document.getElementById('editPreferredMonth').value

                    method: 'PUT',
                    headers: {

                        updatedData: updatedData

        // 메시지 표시
        function showMessage(message, type) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;
            messageElement.textContent = message;
            messageElement.style.position = 'fixed';
            messageElement.style.top = '20px';
            messageElement.style.right = '20px';
            messageElement.style.zIndex = '9999';
            messageElement.style.padding = '15px 20px';
            messageElement.style.borderRadius = '8px';
            messageElement.style.fontSize = '1rem';
            messageElement.style.fontWeight = '500';
            messageElement.style.boxShadow = '0 4px 6px rgba(0, 0, 0, 0.1)';
            
            if (type === 'error') {
                messageElement.style.backgroundColor = '#fef2f2';
                messageElement.style.color = '#991b1b';
                messageElement.style.border = '1px solid #fecaca';
            } else if (type === 'success') {
                messageElement.style.backgroundColor = '#dcfce7';
                messageElement.style.color = '#166534';
                messageElement.style.border = '1px solid #bbf7d0';
            } else {
                messageElement.style.backgroundColor = '#f0f9ff';
                messageElement.style.color = '#1e40af';
                messageElement.style.border = '1px solid #bfdbfe';
            }
            
            document.body.appendChild(messageElement);
            
            setTimeout(() => {
                messageElement.remove();
            }, 5000);
        }

        // 테마 관련 변수
        let currentTheme = 'light';

        // 테마 초기화
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            currentTheme = savedTheme;
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeToggleButton();
        }

        // 테마 토글 버튼 업데이트
        function updateThemeToggleButton() {
            const toggleButton = document.getElementById('themeToggle');
            const icon = toggleButton.querySelector('.theme-toggle-icon');
            const text = toggleButton.querySelector('.theme-toggle-text');
            
            if (currentTheme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = '라이트모드';
            } else {
                icon.textContent = '🌙';
                text.textContent = '다크모드';
            }
        }

        // 테마 토글 기능
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme', currentTheme);
            updateThemeToggleButton();
            
            // 언어에 따른 테마 토글 텍스트 업데이트
            const themeText = document.querySelector('.theme-toggle-text');
            if (themeText) {
                if (currentTheme === 'dark') {
                    themeText.textContent = currentLanguage === 'ko' ? '라이트모드' : 'Light Mode';
                } else {
                    themeText.textContent = currentLanguage === 'ko' ? '다크모드' : 'Dark Mode';
                }
            }
            
            // 부드러운 전환 효과
            document.body.classList.add('theme-transitioning');
            setTimeout(() => {
                document.body.classList.remove('theme-transitioning');
            }, 300);
        }

        // 견적서 생성 함수
        async function generateQuotation(timestamp) {
            if (!isAuthenticated) return;
            
            try {
                showMessage('견적서를 생성 중입니다...', 'info');
                
                // 신청서 데이터 가져오기
                const response = await fetch('/.netlify/functions/get-applications');
                const result = await response.json();
                
                if (!result.success) {
                    showMessage('신청서 데이터를 불러올 수 없습니다.', 'error');
                    return;
                }
                
                const application = result.data.applications.find(app => app['신청일시'] === timestamp);
                if (!application) {
                    showMessage('신청서를 찾을 수 없습니다.', 'error');
                    return;
                }

                // Python 백엔드 API 호출 (Vercel 배포 보호 비활성화됨)
                const quotationResponse = await fetch('https://lrqa-iso-application.vercel.app/api/create-quotation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        timestamp: timestamp,
                        applicationData: application
                    })
                });
                
                if (quotationResponse.ok) {
                    // Word 파일 다운로드
                    const blob = await quotationResponse.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `LRQA_견적서_${application['법인명(국문)']}_${new Date().toISOString().split('T')[0]}.docx`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                    
                    showMessage('견적서가 성공적으로 생성되었습니다!', 'success');
                } else {
                    const errorData = await quotationResponse.json();
                    showMessage(errorData.message || '견적서 생성 중 오류가 발생했습니다.', 'error');
                }
                
            } catch (error) {
                console.error('Error generating quotation:', error);
                showMessage('견적서 생성 중 오류가 발생했습니다.', 'error');
            }
        }
